# Builds the Android APK on GitHub's machines and attaches it to the release.
#
# Why this exists: android/ is generated by `npx cap add android` and gitignored, so the
# APK can only come from a machine with Node, a JDK and the Android SDK. That used to mean
# one specific Windows computer. Now a tag is enough.
#
# The JDK version is not a preference. Capacitor 6 generates a project pinned to Gradle
# 8.2.1, and Gradle 8.2 understands Java only up to 20 -- 21 arrived in 8.5. Raise this to
# 21 and the build dies with "Unsupported class file major version 65" several minutes in.
name: APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # only so the finished APK can be attached to the release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No third-party action for the SDK: GitHub's ubuntu image ships the Android SDK
      # with ANDROID_HOME already set, and the Android Gradle Plugin falls back to that
      # environment variable when local.properties is absent. One less thing to trust.
      - name: Show the toolchain this build actually got
        run: |
          java -version
          node --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME" || { echo "No Android SDK on this runner."; exit 1; }

      - run: npm ci

      # android:init is `cap add android && node tools/apply-android-res.mjs`. The second
      # half is not optional: cap writes Capacitor's template logo, and the copier puts our
      # launcher icons, night splash and styles back over it. Skip it and the APK builds
      # perfectly and looks wrong only once it is on a phone.
      - name: Generate the Android project and lay our resources over it
        run: npm run android:init

      - name: Build
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      # One name, fixed, because README links to
      # /releases/latest/download/follow-desk-debug.apk and that URL is only stable if
      # every release spells the asset identically. tests/test_android.py ties the two
      # together so renaming one fails the suite rather than 404-ing quietly.
      - name: Collect it under the published name
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/follow-desk-debug.apk
          ls -l dist/follow-desk-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: follow-desk-debug-apk
          path: dist/follow-desk-debug.apk
          if-no-files-found: error

      # Tag pushes only. A manual run stops at the artifact above, which is what makes this
      # workflow safe to trigger by hand for a smoke test.
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/follow-desk-debug.apk --clobber
          else
            gh release create "$TAG" dist/follow-desk-debug.apk \
              --title "$TAG" \
              --notes "Android APK built from $TAG. Debug-signed: Android will ask for permission to install it."
          fi
