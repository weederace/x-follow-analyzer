<!-- A docket card with the stamp landing on it: the same two objects the interface
     is built from, so the icon reads as the app rather than as a generic logo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Triage Desk">
  <rect width="64" height="64" rx="14" fill="#F2F4F3"/>
  <g transform="rotate(-3 32 34)">
    <rect x="13" y="14" width="38" height="40" rx="4" fill="#FFFFFF" stroke="#1A1C1E" stroke-opacity="0.12"/>
    <rect x="19" y="21" width="17" height="3" rx="1.5" fill="#006B5A"/>
    <rect x="19" y="28" width="26" height="2" rx="1" fill="#1A1C1E" fill-opacity="0.14"/>
    <rect x="19" y="33" width="20" height="2" rx="1" fill="#1A1C1E" fill-opacity="0.14"/>
  </g>
  <g transform="rotate(-11 38 42)">
    <rect x="24" y="35" width="28" height="13" rx="3" fill="none" stroke="#BA1A1A" stroke-width="2.5"/>
    <path d="M29 41.6l3.4 3.4 6.2-7" fill="none" stroke="#BA1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
